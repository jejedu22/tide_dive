# Développement local, sans Traefik : publie l'API sur http://localhost:${API_PORT}.
#   docker network create proxy     # une seule fois, si la stack Traefik ne tourne pas
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  api:
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      COOKIE_SECURE: "0"   # cookie de session sur http
