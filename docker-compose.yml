# Marée — API FastAPI + précalcul annuel des marées/crépuscules
#
#   docker compose up -d --build                          # 1. API + worker + planificateur
#   docker compose run --rm --entrypoint python api -m app.auth create-admin jerome --email jerome@example.fr --first-name Jérôme --last-name "Le Goff"   # 2. 1er admin
#   puis /admin.html : télécharger FES, ajouter les ports, lancer les calculs
#
# En ligne de commande (sans passer par l'admin) :
#   docker compose run --rm fetch-models
#   docker compose run --rm precompute --year 2026 --port binic
#
# Tester les e-mails (invitations, mot de passe oublié) avec MailDev :
#   docker compose --profile dev up -d      # + boîte de réception sur http://localhost:1080
#   avec dans .env : MAIL_BACKEND=smtp, SMTP_HOST=maildev, SMTP_PORT=1025, SMTP_SECURITY=none
#
x-app: &app
  build: .
  image: maree:latest
  # UID/GID de ton compte sur le serveur (voir .env) pour écrire dans ./data et ./models
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment: &env
    TZ: Europe/Paris
    TIDE_MODEL_DIRECTORY: /models
    PYTMD_CACHE_DIR: /models        # répertoire par défaut de pyTMD 3.x
    FES_MODEL: ${FES_MODEL:-FES2014}  # modèle par défaut, tant qu'aucun n'est choisi dans l'administration
    SCHOOL_ACADEMY: ${SCHOOL_ACADEMY:-Rennes}   # académie pour les vacances scolaires
    COOKIE_SECURE: ${COOKIE_SECURE:-0}          # 1 derrière HTTPS (Traefik)
    SESSION_DAYS: ${SESSION_DAYS:-30}           # durée d'une session de connexion
    PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
    # E-mails : invitations et mot de passe oublié (voir .env.example)
    MAIL_BACKEND: ${MAIL_BACKEND:-none}
    APP_BASE_URL: ${APP_BASE_URL:-}
    APP_NAME: ${APP_NAME:-Marée}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:-}
    INVITE_DAYS: ${INVITE_DAYS:-7}
    RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-60}
  volumes:
    - ./data:/srv/maree/data              # base SQLite (data/plongee.db, chemin relatif de db.py)
    - ${FES_DIR:-./models}:/models:ro

# Identifiants AVISO+ (lus par fetch_aviso_fes.py via AVISO_USERNAME / AVISO_PASSWORD)
x-aviso-env: &aviso-env
  <<: *env
  AVISO_USERNAME: ${AVISO_USERNAME:-}
  AVISO_PASSWORD: ${AVISO_PASSWORD:-}

services:
  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ports', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # --- Derrière Traefik : retirer "ports" et décommenter ---
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.maree.rule=Host(`maree.localhost`)
    #   - traefik.http.services.maree.loadbalancer.server.port=8000
    # networks: [traefik]

  # Téléchargement / mise à jour du modèle FES depuis le FTP AVISO+ (one-shot)
  # Ne retélécharge que les fichiers plus récents côté serveur.
  fetch-models:
    <<: *app
    profiles: ["tools"]
    environment: *aviso-env
    volumes:
      - ${FES_DIR:-./models}:/models          # écriture nécessaire ici
    entrypoint: ["fetch_aviso_fes.py", "--directory", "/models"]
    command: ["--tide", "${FES_MODEL:-FES2014}"]

  # Précalcul manuel : docker compose run --rm precompute --year 2027 --port binic
  precompute:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "-m", "app.precompute"]
    command: ["--help"]
    mem_limit: 4g

  # Exécute les tâches mises en file depuis l'administration ou par le planificateur :
  # précalculs, téléchargement FES, vacances scolaires. Une tâche à la fois.
  worker:
    <<: *app
    environment: *aviso-env
    volumes:
      - ./data:/srv/maree/data                 # base SQLite (data/plongee.db, chemin relatif de db.py)
      - ${FES_DIR:-./models}:/models          # écriture pour la mise à jour FES
    command: ["python", "-m", "app.jobs", "worker"]
    restart: unless-stopped
    mem_limit: 4g
    stop_grace_period: 30s                    # laisse le temps d'interrompre proprement la tâche en cours

  # Planificateur (voir docker/crontab) : il ne calcule rien lui-même,
  # il ajoute des tâches à la file exécutée par le worker.
  scheduler:
    <<: *app
    volumes:
      - ./data:/srv/maree/data
    # Vacances scolaires demandées dès le démarrage (sinon seulement le 1er du mois)
    command:
      - sh
      - -c
      - python -m app.jobs enqueue school-holidays; exec supercronic /etc/crontab.maree
    restart: unless-stopped

  # Serveur SMTP de développement : capture tous les e-mails envoyés (rien ne
  # part réellement) et les affiche dans une boîte de réception web.
  # Démarré seulement avec le profil dev : docker compose --profile dev up -d
  maildev:
    image: maildev/maildev:2.2.1
    profiles: ["dev"]
    environment:
      TZ: Europe/Paris
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 1080
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"   # interface web (le port SMTP 1025 reste interne)
    restart: unless-stopped
    # --- Derrière Traefik : retirer "ports" et décommenter ---
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.maildev.rule=Host(`maildev.localhost`)
    #   - traefik.http.services.maildev.loadbalancer.server.port=1080
    # networks: [default, traefik]

# networks:
#   traefik:
#     external: true